<!DOCTYPE html>
<html>

<head>
    <title>gip.mes.client.avui.Browser</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script>
        // localStorage bridge for the .NET WASM client (BrowserSettingsStorage.cs).
        // Keeps client-local settings (connection settings, login, app settings)
        // persistent across page reloads. localStorage is per-origin and survives
        // browser restarts; cookies are not used (4KB limit, sent with every request).
        window.iPlusSettings = {
            getItem: function (key) {
                try { return window.localStorage.getItem(key); } catch (e) { return null; }
            },
            setItem: function (key, value) {
                try { window.localStorage.setItem(key, value); } catch (e) { }
            }
        };
        // Returns the absolute page URL; used by VBScriptEditor to resolve the
        // relative /scriptrefs URLs to absolute ones (HttpClient on WASM has no
        // BaseAddress, and relative request URIs are not supported).
        window.iPlusGetUrl = function () {
            return window.location.href;
        };
        // Fetches a managed assembly (PE image) from /scriptrefs for the Roslyn script
        // editor (VBScriptEditor). The WASM runtime ships assemblies as WebAssembly
        // modules, which Roslyn cannot use as metadata references - so the build copies
        // the PE DLLs to wwwroot/scriptrefs and the editor loads them via this bridge.
        // Returns null when the file does not exist.
        window.iPlusFetchDll = async function (name) {
            try {
                const res = await fetch('scriptrefs/' + encodeURIComponent(name));
                if (!res.ok) return null;
                return new Uint8Array(await res.arrayBuffer());
            } catch (e) { return null; }
        };
        // Synchronous XHR bridge for the SQL Tunnel stage-1 token acquisition
        // (LoginView.TryAcquireTunnelToken). ApplyConnectionSettingsFromHelper is
        // synchronous and runs on the WASM main thread, so an async fetch cannot be used
        // there — the browser performs the wait internally (same rationale as the fork's
        // sync-XHR tunnel transport, docs/SqlTunnel-OptionB-Implementation.md §7).
        // Returns JSON {status, text}.
        window.iPlusSyncXhr = function (method, url, body) {
            var xhr = new XMLHttpRequest();
            xhr.open(method, url, false);
            if (body) { xhr.setRequestHeader('Content-Type', 'application/json'); }
            xhr.send(body || null);
            return JSON.stringify({ status: xhr.status, text: xhr.responseText });
        };
    </script>
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash">
        <div class="splash-content">
            <img src="./iplus-logo.png" alt="iPlus" class="splash-logo" />
            <div class="splash-title">iPlus</div>
            <div class="splash-spinner"></div>
            <div class="splash-status">Loading application&hellip;</div>
        </div>
    </div>
</div>
<script type='module' src="main#[.{fingerprint}].js"></script>
</body>

</html>
